name: Harbor Task Package Verification

on:
  workflow_dispatch:
    inputs:
      harbor_version:
        description: "Pinned Harbor package version on PyPI"
        required: false
        default: "0.25.0"

permissions:
  contents: read

concurrency:
  group: harbor-verify
  cancel-in-progress: false

jobs:
  verify-harbor:
    name: Harbor Task Lint and Oracle Evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Harden Runner Environment
        run: |
          echo "=== Hardening CI Runner Execution Boundary ==="
          # Ensure no stray environment variables leak into container evaluations
          unset GEMINI_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set Up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify Host Docker Daemon
        run: |
          echo "=== Verifying Docker Availability on Hosted Runner ==="
          docker version
          docker info

      - name: Install Project Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Pinned Harbor CLI
        run: |
          HARBOR_PIN="${{ github.event.inputs.harbor_version || '0.25.0' }}"
          echo "=== Installing Pinned Harbor Framework: harbor==${HARBOR_PIN} ==="
          pip install "harbor==${HARBOR_PIN}"
          harbor --version

      - name: Generate Deterministic Sample Task Package
        run: |
          echo "=== Generating Deterministic Sample Task Package via CTF Exporter ==="
          python backend/scripts/export_sample_task.py --output-dir staged_harbor_task
          ls -la staged_harbor_task/
          ls -la staged_harbor_task/ctf-sample-math-task/

      - name: Validate Task Package Structure
        run: |
          TASK_DIR="staged_harbor_task/ctf-sample-math-task"
          echo "=== Verifying Required Harbor Package Assets ==="
          test -f "${TASK_DIR}/task.toml" || (echo "Missing task.toml" && exit 1)
          test -f "${TASK_DIR}/instruction.md" || (echo "Missing instruction.md" && exit 1)
          test -f "${TASK_DIR}/environment/Dockerfile" || (echo "Missing environment/Dockerfile" && exit 1)
          test -f "${TASK_DIR}/tests/Dockerfile" || (echo "Missing tests/Dockerfile" && exit 1)
          test -f "${TASK_DIR}/solution/solve.sh" || (echo "Missing solve.sh" && exit 1)
          test -f "${TASK_DIR}/tests/test.sh" || (echo "Missing tests/test.sh" && exit 1)
          echo "All essential task package files verified on disk."

      - name: Run Harbor Lint
        id: run-lint
        run: |
          TASK_DIR="staged_harbor_task/ctf-sample-math-task"
          echo "=== Running Harbor Static Linter against Generated Task ==="
          harbor lint "${TASK_DIR}"

      - name: Execute Harbor Oracle Evaluation
        id: run-oracle
        run: |
          TASK_DIR="staged_harbor_task/ctf-sample-math-task"
          mkdir -p harbor_jobs
          echo "=== Executing Harbor Evaluation with Oracle Agent ==="
          harbor run -p "${TASK_DIR}" -a oracle --jobs-dir ./harbor_jobs

      - name: Verify Verifier Reward Protocol
        id: verify-reward
        run: |
          echo "=== Inspecting Harbor Evaluation Results & Reward Score ==="
          python backend/scripts/verify_harbor_reward.py --jobs-dir ./harbor_jobs --expected-reward 1.0

      - name: Generate Job Execution Summary
        if: always()
        run: |
          LINT_OUTCOME="${{ steps.run-lint.outcome }}"
          ORACLE_OUTCOME="${{ steps.run-oracle.outcome }}"
          REWARD_OUTCOME="${{ steps.verify-reward.outcome }}"
          REWARD_SCORE="${{ steps.verify-reward.outputs.reward_score }}"

          format_status() {
            case "$1" in
              success) echo "PASSED" ;;
              failure) echo "FAILED" ;;
              skipped) echo "SKIPPED" ;;
              cancelled) echo "CANCELLED" ;;
              *) echo "NOT_RUN (${1:-unknown})" ;;
            esac
          }

          LINT_STATUS=$(format_status "$LINT_OUTCOME")
          ORACLE_STATUS=$(format_status "$ORACLE_OUTCOME")
          REWARD_STATUS=$(format_status "$REWARD_OUTCOME")

          if [ "$LINT_OUTCOME" = "success" ] && [ "$ORACLE_OUTCOME" = "success" ] && [ "$REWARD_OUTCOME" = "success" ]; then
            OVERALL_VERDICT="SUCCESS"
            NOTE_BLOCK="> [!NOTE]\n> The Oracle evaluation validates the reference solution (\`solution/solve.sh\`) and verifier (\`tests/test.sh\`) inside an isolated container sandbox. Real AI coding agent benchmarking was **NOT** performed during this test."
          else
            OVERALL_VERDICT="FAILURE"
            NOTE_BLOCK="> [!CAUTION]\n> Harbor task package verification did not pass. Inspect step logs and uploaded artifacts for failure diagnostics."
          fi

          if [ -z "$REWARD_SCORE" ]; then
            REWARD_DISPLAY="N/A"
          else
            REWARD_DISPLAY="$REWARD_SCORE"
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Harbor Task Package Verification Summary

          **Overall Verdict: ${OVERALL_VERDICT}**

          - **Task Name**: \`ctf/sample-math-task\`
          - **Harbor Specification Version**: \`1.4\`
          - **Harbor CLI Version**: \`${{ github.event.inputs.harbor_version || '0.25.0' }}\`
          - **Task Linter (\`harbor lint\`)**: **${LINT_STATUS}**
          - **Oracle Evaluation (\`harbor run -a oracle\`)**: **${ORACLE_STATUS}**
          - **Reward Verification**: **${REWARD_STATUS}** (Score: \`${REWARD_DISPLAY}\`)

          $(echo -e "${NOTE_BLOCK}")
          EOF

      - name: Upload Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: harbor-verification-report
          path: |
            staged_harbor_task/ctf-sample-math-task.zip
            harbor_jobs/
          if-no-files-found: warn
          retention-days: 7
